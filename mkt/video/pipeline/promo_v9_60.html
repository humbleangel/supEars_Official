<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  .off { position: absolute; left: -99999px; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div class="off">
  <img id="emblem" src="assets30/emblem.png">
  <img id="appicon" src="assets30/appicon.png">
</div>
<script src="ktype.js"></script>
<script src="fx.js"></script>
<script src="collage_cues.js"></script>
<script src="ring_data.js"></script>
<script src="hits_text.js"></script>
<script>
{
'use strict';
/* V9 60s MASTERPIECE "25 VOICES, ONE EAR" — from zero.
   ACT I 0-8.8 THE TRAP / ACT II 8.8-38.8 THE PILGRIMAGE / ACT III 38.8-49 THE PROOF / ACT IV 49-60 THE RELEASE */
const W = 1920, H = 1080;
const c = document.getElementById('c');
const x = c.getContext('2d');
const A = id => document.getElementById(id);
const TAU = Math.PI * 2;

const EMERALD = [16, 185, 129], EMERALD_LT = [122, 240, 190];
const REC = [231, 76, 60];
const GOLD = [201, 162, 39], GOLD_LT = [231, 193, 90];
const TEXT = [234, 242, 238], MUTED = [143, 167, 155];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, t) => ease((t - e0) / (e1 - e0));
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const frac = v => v - Math.floor(v);
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
const env = (t, s0, fi, s1, fo) => smooth(s0, s0 + fi, t) * (1 - smooth(s1 - fo, s1, t));

const FLAGS = {};
function loadFlags() {
  const names = ['pt','en','es','fr','de','it','ru','zh','ja','ko','nl','pl','tr','uk','hi','ar','id','vi','ro','el','sv','cs','hu','ur','th'];
  return Promise.all(names.map(n => new Promise(res => {
    if (typeof FLAG_B64 === 'undefined' || !FLAG_B64[n]) return res();
    const im = new Image();
    im.onload = () => { FLAGS[n] = im; res(); };
    im.onerror = () => res();
    im.src = 'data:image/png;base64,' + FLAG_B64[n];
  })));
}

const LANGNAME = { pt:'Portuguese', en:'English', es:'Spanish', fr:'French', de:'German', it:'Italian', ru:'Russian', zh:'Chinese', ja:'Japanese', ko:'Korean', nl:'Dutch', pl:'Polish', tr:'Turkish', uk:'Ukrainian', hi:'Hindi', ar:'Arabic', id:'Indonesian', vi:'Vietnamese', ro:'Romanian', el:'Greek', sv:'Swedish', cs:'Czech', hu:'Hungarian', ur:'Urdu', th:'Thai' };
const codeOf = lang => (lang || 'en').split('-')[0];
const HITS = (window.COLLAGE && window.COLLAGE.hits) || [];
const CAPTIONS = {
  hook: 'Are you tired of paying subscriptions to talk?',
  brand_F: 'supEars. The Ear that writes what it hears.',
  privacy: '100% offline. No account. No cloud.',
  how_F: 'Tap the ear. Speak. Read what it writes.',
  cta2: 'supEars. Public release October tenth.'
};
const ANCHORS = (window.COLLAGE && window.COLLAGE.anchors) || [];
function activeHit(t) {
  /* last-started wins: during overlaps the flash follows the newest voice */
  let found = null;
  for (let i = 0; i < HITS.length; i++) {
    const h = HITS[i];
    if (t >= h.start && t < h.start + h.dur) found = { h, i };
  }
  return found;
}
function activeAnchor(t) {
  for (const a of ANCHORS) {
    if (t >= a.start && t < a.start + a.dur) return a;
  }
  return null;
}
/* caption pill: anchors only (during pilgrimage the flash IS the caption) */
function caption(t, a) {
  const an = activeAnchor(t);
  if (!an || a <= 0.001) return;
  const text = CAPTIONS[an.id] || an.id;
  x.save();
  x.globalAlpha = a;
  x.font = '600 40px "Segoe UI",system-ui,sans-serif';
  const tw = x.measureText(text).width;
  x.fillStyle = 'rgba(0,0,0,0.72)';
  x.beginPath();
  if (x.roundRect) x.roundRect(W / 2 - tw / 2 - 32, H - 158, tw + 64, 72, 36); else x.rect(W / 2 - tw / 2 - 32, H - 158, tw + 64, 72);
  x.fill();
  x.strokeStyle = rgba(EMERALD, 0.7); x.lineWidth = 2; x.stroke();
  x.fillStyle = rgba(TEXT, 1);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, W / 2, H - 120);
  x.restore();
}
function kline(txt, cx, cy, size, t, t0, dur, opts = {}) {
  const hot = win(t, t0, t0 + 0.4);
  if (t >= t0 && hot < 1) {
    x.save(); x.globalAlpha = 0.20 * (1 - hot);
    ktype(x, txt, cx - 30 * (1 - hot), cy, size, t, t0, dur, opts);
    x.restore();
  }
  ktype(x, txt, cx, cy, size, t, t0, dur, opts);
}
function tunnel(t, a) {
  if (a <= 0.001) return;
  const vx = W / 2 + Math.sin(t * 0.5) * 40, hy = H * 0.40;
  x.save();
  x.globalAlpha = a;
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 24; i++) {
    const ang = (i / 24) * TAU + t * 0.06;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const g = x.createLinearGradient(vx, hy, vx + dx * 1400, hy + dy * 1400);
    g.addColorStop(0, rgba(EMERALD, 0));
    g.addColorStop(0.4, rgba(i % 4 === 0 ? GOLD : EMERALD, 0.4));
    g.addColorStop(1, rgba(i % 4 === 0 ? GOLD_LT : EMERALD_LT, 0));
    x.strokeStyle = g; x.lineWidth = 2;
    x.beginPath(); x.moveTo(vx, hy); x.lineTo(vx + dx * 1400, hy + dy * 1400); x.stroke();
  }
  for (let i = 0; i < 14; i++) {
    const z = frac(i / 14 + t * 0.55);
    const y = hy + (H - hy) * Math.pow(z, 2.4);
    x.strokeStyle = rgba(i % 3 === 0 ? GOLD : EMERALD, 0.08 + 0.5 * Math.pow(z, 1.5));
    x.lineWidth = 1 + 5 * z * z;
    x.beginPath();
    x.ellipse(vx, hy, 60 + W * 0.75 * Math.pow(z, 2.2), Math.max(1, (y - hy) * 0.9), 0, 0, TAU);
    x.stroke();
  }
  x.restore();
}
/* THE app ring, alive: 120-pt live waveform (paint_circular_waveform) +
   16 energy bars (paint_waveform). Red when speaking, emerald at rest. */
function ringLive(t, cx, cy, R, a) {
  if (a <= 0.001 || !window.RING) return;
  const F = clamp(Math.floor(t * 30), 0, window.RING.levels.length - 1);
  const level = window.RING.levels[F] || 0;
  const bands = window.RING.bands;
  const off = F * 120;
  const speaking = level > 0.03;
  const col = speaking ? REC : EMERALD;
  const im = A('appicon');
  x.save();
  x.globalAlpha = a;
  x.fillStyle = 'rgba(0,0,0,0.72)';
  x.beginPath(); x.arc(cx, cy, R * 1.8, 0, TAU); x.fill();
  x.save();
  x.globalCompositeOperation = 'lighter';
  const halo = x.createRadialGradient(cx, cy, R * 0.4, cx, cy, R * 2.0);
  halo.addColorStop(0, rgba(col, 0.30));
  halo.addColorStop(0.6, rgba(col, 0.10));
  halo.addColorStop(1, rgba(col, 0));
  x.fillStyle = halo;
  x.beginPath(); x.arc(cx, cy, R * 2.0, 0, TAU); x.fill();
  x.restore();
  if (im.naturalWidth) {
    x.save();
    x.filter = 'brightness(1.6)';
    x.drawImage(im, cx - R * 0.62, cy - R * 0.62, R * 1.24, R * 1.24);
    x.restore();
  }
  /* envelope ring: unipolar 0..127 syllabic energy, breathes outward */
  x.save();
  x.beginPath();
  for (let i = 0; i <= 120; i++) {
    const b = bands[off + (i % 120)] || 0;
    const r = R * (1 + (b / 127) * 0.55);
    const ang = (i / 120) * TAU - Math.PI / 2;
    const px = cx + Math.cos(ang) * r, py = cy + Math.sin(ang) * r;
    if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
  }
  x.closePath();
  x.strokeStyle = rgba(col, 0.65 + 0.35 * clamp(level * 4, 0, 1));
  x.lineWidth = 5;
  x.shadowColor = rgba(col, 0.8); x.shadowBlur = 24;
  x.stroke();
  x.restore();
  x.restore();
}
function grain(a) {
  x.save(); x.globalAlpha = a;
  let s = 7;
  const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < 500; i++) x.fillStyle = r() > 0.5 ? '#fff' : '#000', x.fillRect((r() * W) | 0, (r() * H) | 0, 2, 2);
  x.restore();
}

function draw(t) {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = '#000';
  x.fillRect(0, 0, W, H);
  /* S adapts to the real canvas: render-promo sizes it to the viewport,
     so previews (960) and finals (1920) share one design space */
  const S = c.width / 1920;
  x.setTransform(S, 0, 0, S, 0, 0);
  const g0 = x.createLinearGradient(0, 0, 0, H);
  g0.addColorStop(0, '#030806'); g0.addColorStop(0.55, '#05110D'); g0.addColorStop(1, '#020504');
  x.fillStyle = g0; x.fillRect(0, 0, W, H);

  /* ACT I — 0-8.8 THE TRAP */
  if (t < 4.4) {
    const a = env(t, 0, 0.12, 4.4, 0.25);
    if (a > 0.001) {
      if (t < 0.6) FX.whip(x, W, H, t, 0.0, 0.5, 0, '231,76,60');
      const vg = x.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 900);
      vg.addColorStop(0, `rgba(231,76,60,${0.16 * a * (0.7 + 0.3 * Math.sin(t * 5))})`);
      vg.addColorStop(1, 'rgba(231,76,60,0)');
      x.fillStyle = vg; x.fillRect(0, 0, W, H);
      kline('Are you tired', W / 2, H / 2 - 120, 96, t, 0.05, 4.2,
        { weight: 800, track: -2, rgb: TEXT, glow: REC, extrude: 4 });
      kline('of paying to talk?', W / 2, H / 2 + 20, 96, t, 0.9, 3.3,
        { weight: 800, track: -2, rgb: TEXT, glow: REC, extrude: 4 });
      caption(t, a);
    }
  }
  if (t >= 4.2 && t < 9.0) {
    const a = env(t, 4.2, 0.1, 9.0, 0.2);
    if (a > 0.001) {
      const slam = easeBack(win(t, 4.25, 4.8));
      const drift = 1 + 0.02 * win(t, 4.25, 8.8);
      const shake = t < 5.4 ? Math.sin((t - 4.25) * 40) * 14 * Math.exp(-3 * (t - 4.25)) : 0;
      x.save();
      x.globalAlpha = a;
      x.translate(W / 2 + shake, H / 2);
      const s = (1.25 - 0.25 * slam) * drift;
      x.scale(s, s);
      x.translate(-W / 2, -H / 2);
      const gg = x.createLinearGradient(0, 0, W, H);
      gg.addColorStop(0, '#F0CE6B'); gg.addColorStop(0.5, '#C9A227'); gg.addColorStop(1, '#7A5F1C');
      x.fillStyle = gg; x.fillRect(0, 0, W, H);
      x.restore();
      kline('Escape the Subscriptions Trap.', W / 2 + shake, H / 2, 76, t, 4.35, 4.4,
        { weight: 800, track: -2, rgb: [10, 13, 11] });
      caption(t, a);
    }
  }
  /* ACT II — 8.8-38.8 THE PILGRIMAGE: tunnel + living ring + language flash */
  if (t >= 8.8 && t < 39.0) {
    const a = env(t, 8.8, 0.2, 39.0, 0.3);
    if (a > 0.001) {
      if (t < 9.5) FX.whip(x, W, H, t, 8.8, 0.6, 1, '16,185,129');
      tunnel(t - 8.8, a);
      /* dim the tunnel heart so the living ring owns the focus */
      x.save();
      x.globalAlpha = a;
      const dim = x.createRadialGradient(620, H / 2 - 20, 60, 620, H / 2 - 20, 520);
      dim.addColorStop(0, 'rgba(0,0,0,0.55)');
      dim.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = dim;
      x.fillRect(0, 0, W, H);
      x.restore();
      ringLive(t, 620, H / 2 - 20, 215, a);
      /* scrim behind the flash zone: language must read at a glance */
      x.save();
      x.globalAlpha = a * 0.85;
      x.fillStyle = 'rgba(0,0,0,0.60)';
      x.fillRect(1050, H / 2 - 260, 700, 480);
      x.restore();
      const hit = activeHit(t);
      if (hit) {
        const pop = easeBack(win(t, hit.h.start, hit.h.start + 0.35));
        const fade = 1 - smooth(hit.h.start + hit.h.dur - 0.25, hit.h.start + hit.h.dur, t);
        const cd = codeOf(hit.h.lang);
        const txt = (window.HIT_TEXT && window.HIT_TEXT[hit.h.id]) || [LANGNAME[cd] || hit.h.id, ''];
        const FF = '"Segoe UI","Microsoft YaHei","Meiryo UI","Nirmala UI","Segoe UI Historic",system-ui,sans-serif';
        let ns = 62;
        x.save();
        x.font = `800 ${ns}px ${FF}`;
        while (x.measureText(txt[0]).width > 620 && ns > 28) {
          ns -= 4;
          x.font = `800 ${ns}px ${FF}`;
        }
        const slide = (1 - easeOut(win(t, hit.h.start, hit.h.start + 0.4))) * 60;
        x.globalAlpha = a * clamp(pop, 0, 1) * fade;
        x.translate(1400 + slide, H / 2 - 20); x.scale(pop, pop);
        if (FLAGS[cd]) x.drawImage(FLAGS[cd], -52, -228, 104, 68);
        x.font = '700 30px "Segoe UI",system-ui,sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillStyle = rgba(GOLD_LT, 0.95);
        x.fillText(`${LANGNAME[cd] || hit.h.id} · VOICE ${String(hit.i + 1).padStart(2, '0')}/${HITS.length}`, 0, -160);
        x.font = `800 ${ns}px ${FF}`;
        x.shadowColor = rgba(EMERALD, 0.7); x.shadowBlur = 30;
        x.fillStyle = rgba(TEXT, 1);
        x.fillText(txt[0], 0, -50);
        x.shadowColor = 'transparent'; x.shadowBlur = 0;
        x.font = 'italic 600 38px "Segoe UI",system-ui,sans-serif';
        x.fillStyle = rgba(MUTED, 1);
        x.fillText(txt[1], 0, 60);
        x.restore();
        x.save();
        x.globalAlpha = a;
        const cnt = `VOICE ${String(hit.i + 1).padStart(2, '0')} / ${HITS.length}`;
        x.font = '700 36px "Segoe UI",system-ui,sans-serif';
        const cw = x.measureText(cnt).width;
        x.fillStyle = 'rgba(0,0,0,0.60)';
        x.beginPath();
        if (x.roundRect) x.roundRect(W / 2 - cw / 2 - 24, 100, cw + 48, 60, 30); else x.rect(W / 2 - cw / 2 - 24, 100, cw + 48, 60);
        x.fill();
        x.font = '700 36px "Segoe UI",system-ui,sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillStyle = rgba(GOLD_LT, 0.95);
        x.fillText(cnt, W / 2, 132);
        x.restore();
      }
    }
  }
  /* ACT III — 38.8-49 THE PROOF */
  if (t >= 38.8 && t < 49.2) {
    const a = env(t, 38.8, 0.3, 49.2, 0.3);
    if (a > 0.001) {
      const push = 1 + 0.03 * win(t, 38.8, 49.2);
      x.save();
      x.globalAlpha = a;
      x.translate(W / 2, H / 2); x.scale(push, push); x.translate(-W / 2, -H / 2);
      /* listening sweep: slow radar hand behind the ring keeps the beat alive */
      x.save();
      x.globalCompositeOperation = 'lighter';
      const sang = (t - 38.8) * 0.9;
      const sg = x.createLinearGradient(W / 2, H / 2 - 160, W / 2 + Math.cos(sang) * 800, H / 2 - 160 + Math.sin(sang) * 800);
      sg.addColorStop(0, rgba(EMERALD, 0));
      sg.addColorStop(1, rgba(EMERALD_LT, 0.35));
      x.strokeStyle = sg; x.lineWidth = 3;
      x.beginPath(); x.moveTo(W / 2, H / 2 - 160);
      x.lineTo(W / 2 + Math.cos(sang) * 800, H / 2 - 160 + Math.sin(sang) * 800); x.stroke();
      x.restore();
      ringLive(t, W / 2, H / 2 - 160, 190, 1);
      kline('100% offline.', W / 2, H / 2 + 190, 84, t, 39.1, 9.5,
        { weight: 800, track: -2, rgb: TEXT, glow: EMERALD, extrude: 5 });
      kline('No account. No cloud. Tap the ear. Speak. Read.', W / 2, H / 2 + 300, 36, t, 40.2, 8.4,
        { weight: 600, track: 0.6, rgb: MUTED });
      x.restore();
      caption(t, a);
    }
  }
  /* ACT IV — 49-60 THE RELEASE: flags unite, date, credit (push+wave: alive to the end) */
  if (t >= 49.0) {
    const e = env(t, 49.0, 0.4, 60.0, 0.0);
    if (e > 0.001) {
      const push = 1 + 0.04 * win(t, 49.0, 60.0);
      x.save();
      x.globalAlpha = e;
      x.translate(W / 2, H / 2); x.scale(push, push); x.translate(-W / 2, -H / 2);
      x.fillStyle = 'rgba(1,3,2,0.94)';
      x.fillRect(-100, -100, W + 200, H + 200);
      x.restore();
      const em = A('emblem');
      if (em.naturalWidth) {
        const pulse = 1 + 0.015 * Math.sin((t - 49.0) * 2.2);
        x.save(); x.globalAlpha = e;
        x.translate(W / 2, H / 2 - 190); x.scale(pulse, pulse);
        x.drawImage(em, -em.naturalWidth / 2, -em.naturalHeight / 2, em.naturalWidth, em.naturalHeight);
        x.restore();
      }
      kline('supEars', W / 2, H / 2 + 150, 100, t, 49.6, 10.2,
        { weight: 800, track: 2, rgb: TEXT, glow: EMERALD, extrude: 5 });
      /* the unity payoff: one flag per pilgrimage voice, assembling in order, then waving */
      HITS.forEach((hh, k) => {
        const cd = codeOf(hh.lang);
        const f = FLAGS[cd];
        if (!f) return;
        const t0 = 50.0 + k * 0.18;
        const pop = easeBack(win(t, t0, t0 + 0.4));
        if (pop <= 0) return;
        const cols = 12;
        /* column-synced wave: vertical pairs move together, grid stays aligned */
        const wave = t > t0 + 0.4 ? Math.sin((t - t0) * 2.4 + (k % cols) * 0.7) * 5 : 0;
        const bx = W / 2 + ((k % cols) - (cols - 1) / 2) * 140;
        const by = H / 2 + 268 + Math.floor(k / cols) * 80 + wave;
        x.save();
        x.globalAlpha = e * clamp(pop, 0, 1);
        x.translate(bx, by); x.scale(Math.max(0.01, pop), Math.max(0.01, pop));
        x.drawImage(f, -52, -32, 104, 64);
        x.restore();
      });
      kline('Public release · October 10, 2026', W / 2, H / 2 + 470, 30, t, 54.5, 5.2,
        { weight: 600, track: 1.4, rgb: GOLD_LT });
      kline('Developed by HumbleAngel', W / 2, H / 2 + 514, 22, t, 55.2, 4.5,
        { weight: 500, track: 0.8, rgb: MUTED });
      caption(t, e);
    }
  }

  grain(0.03);
  x.setTransform(1, 0, 0, 1, 0, 0);
}

window.__draw = draw;
window.__ready = loadFlags();
}
</script>
</body>
</html>
