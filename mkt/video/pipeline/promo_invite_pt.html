<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  .off { position: absolute; left: -99999px; }
</style>
</head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<div class="off">
  <img id="emblem" src="assets30/emblem.png">
  <img id="appicon" src="assets30/appicon.png">
</div>
<script src="ktype.js"></script>
<script src="fx.js"></script>
<script>
{
'use strict';
/* PT invitation baseline, 15s vertical 1080x1920. Others follow this shape. */
const W = 1080, H = 1920;
const c = document.getElementById('c');
const x = c.getContext('2d');
const A = id => document.getElementById(id);
const TAU = Math.PI * 2;

const EMERALD = [16, 185, 129];
const REC = [231, 76, 60];
const GOLD = [201, 162, 39], GOLD_LT = [231, 193, 90];
const TEXT = [234, 242, 238], MUTED = [143, 167, 155];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = (e0, e1, t) => ease((t - e0) / (e1 - e0));
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
const env = (t, s0, fi, s1, fo) => smooth(s0, s0 + fi, t) * (1 - smooth(s1 - fo, s1, t));

const FLAGS = {};
function loadFlags() {
  return new Promise(res => {
    if (typeof FLAG_B64 === 'undefined' || !FLAG_B64.pt) return res();
    const im = new Image();
    im.onload = () => { FLAGS.pt = im; res(); };
    im.onerror = () => res();
    im.src = 'data:image/png;base64,' + FLAG_B64.pt;
  });
}
function kline(txt, cx, cy, size, t, t0, dur, opts = {}) {
  const hot = win(t, t0, t0 + 0.4);
  if (t >= t0 && hot < 1) {
    x.save(); x.globalAlpha = 0.20 * (1 - hot);
    ktype(x, txt, cx - 30 * (1 - hot), cy, size, t, t0, dur, opts);
    x.restore();
  }
  ktype(x, txt, cx, cy, size, t, t0, dur, opts);
}
function ring(t, cx, cy, R, a, col) {
  if (a <= 0.001) return;
  const pulse = 1 + 0.03 * Math.sin(t * 3);
  const im = A('appicon');
  x.save(); x.globalAlpha = a;
  x.fillStyle = 'rgba(0,0,0,0.72)';
  x.beginPath(); x.arc(cx, cy, R * 1.6 * pulse, 0, TAU); x.fill();
  x.save();
  x.globalCompositeOperation = 'lighter';
  const halo = x.createRadialGradient(cx, cy, R * 0.4, cx, cy, R * 2.0);
  halo.addColorStop(0, rgba(col, 0.30)); halo.addColorStop(1, rgba(col, 0));
  x.fillStyle = halo;
  x.beginPath(); x.arc(cx, cy, R * 2.0, 0, TAU); x.fill();
  x.restore();
  if (im.naturalWidth) {
    x.save(); x.filter = 'brightness(1.6)';
    x.beginPath(); x.arc(cx, cy, R * 0.62, 0, TAU); x.clip();
    x.drawImage(im, cx - R * 0.62, cy - R * 0.62, R * 1.24, R * 1.24);
    x.restore();
  }
  x.beginPath(); x.arc(cx, cy, R * 1.22 * pulse, 0, TAU);
  x.strokeStyle = rgba(col, 0.95); x.lineWidth = 7;
  x.shadowColor = rgba(col, 0.8); x.shadowBlur = 30;
  x.stroke();
  x.restore();
}
function bubble(t, cx, cy, w, a) {
  if (a <= 0.001) return;
  const pop = easeBack(win(t, 8.1, 8.6));
  x.save();
  x.globalAlpha = a * clamp(pop, 0, 1);
  x.translate(cx, cy); x.scale(Math.max(0.01, pop), Math.max(0.01, pop));
  x.fillStyle = 'rgba(6,14,11,0.95)';
  x.strokeStyle = rgba(EMERALD, 0.9); x.lineWidth = 4;
  x.beginPath();
  if (x.roundRect) x.roundRect(-w / 2, -110, w, 220, 44); else x.rect(-w / 2, -110, w, 220);
  x.fill(); x.stroke();
  x.beginPath();
  x.moveTo(-60, 110); x.lineTo(-30, 170); x.lineTo(10, 110); x.closePath();
  x.fillStyle = 'rgba(6,14,11,0.95)'; x.fill();
  x.fillStyle = rgba(TEXT, 1);
  for (let i = 0; i < 3; i++) {
    x.beginPath(); x.arc(-60 + i * 60, 0, 22, 0, TAU); x.fill();
  }
  x.restore();
}
function grain(a) {
  x.save(); x.globalAlpha = a;
  let s = 7;
  const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < 300; i++) x.fillStyle = r() > 0.5 ? '#fff' : '#000', x.fillRect((r() * W) | 0, (r() * H) | 0, 3, 3);
  x.restore();
}

const CATS = ['BUG', 'IMPRESSÃO', 'CRÍTICA', 'SUGESTÃO', 'ELOGIO'];

function draw(t) {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = '#000';
  x.fillRect(0, 0, W, H);
  const S = c.width / 1080;
  x.setTransform(S, 0, 0, S, 0, 0);
  const g0 = x.createLinearGradient(0, 0, 0, H);
  g0.addColorStop(0, '#030806'); g0.addColorStop(0.55, '#05110D'); g0.addColorStop(1, '#020504');
  x.fillStyle = g0; x.fillRect(0, 0, W, H);

  /* 0-3.8 HOOK */
  if (t < 4.0) {
    const a = env(t, 0, 0.12, 4.0, 0.25);
    if (a > 0.001) {
      if (t < 0.6) FX.whip(x, W, H, t, 0.0, 0.5, 0, '231,76,60');
      ring(t, W / 2, 560, 150, a, REC);
      kline('Achou um bug?', W / 2, 1050, 84, t, 0.1, 3.6,
        { weight: 800, track: -2, rgb: TEXT, glow: REC, extrude: 4 });
      kline('Tem uma ideia?', W / 2, 1170, 84, t, 0.9, 2.8,
        { weight: 800, track: -2, rgb: TEXT, glow: REC, extrude: 4 });
      kline('Comenta aqui!', W / 2, 1330, 96, t, 1.8, 1.9,
        { weight: 800, track: -1, rgb: GOLD_LT, glow: REC, extrude: 4 });
    }
  }
  /* 3.6-8.2 FIVE DOORS */
  if (t >= 3.6 && t < 8.4) {
    const a = env(t, 3.6, 0.2, 8.4, 0.25);
    if (a > 0.001) {
      ring(t, W / 2, 420, 110, a * 0.9, EMERALD);
      CATS.forEach((ct, k) => {
        const pop = easeBack(win(t, 3.8 + k * 0.5, 4.3 + k * 0.5));
        if (pop <= 0) return;
        const cy = 800 + k * 170;
        x.save();
        x.globalAlpha = a * clamp(pop, 0, 1);
        x.translate(W / 2, cy); x.scale(Math.max(0.01, pop), Math.max(0.01, pop));
        x.fillStyle = 'rgba(2,8,6,0.92)';
        x.fillRect(-380, -62, 760, 124);
        x.strokeStyle = rgba(k % 2 ? GOLD : EMERALD, 0.85); x.lineWidth = 3;
        x.strokeRect(-380, -62, 760, 124);
        x.font = '800 56px "Segoe UI",system-ui,sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillStyle = rgba(TEXT, 1);
        x.fillText(ct, 0, 4);
        x.restore();
      });
    }
  }
  /* 8-11 HOW */
  if (t >= 8.0 && t < 11.4) {
    const a = env(t, 8.0, 0.2, 11.4, 0.25);
    if (a > 0.001) {
      bubble(t, W / 2, 620, 640, a);
      kline('Deixe seu comentário', W / 2, 1080, 72, t, 8.2, 3.0,
        { weight: 800, track: -1, rgb: TEXT, glow: EMERALD, extrude: 4 });
      kline('aqui embaixo ⬇', W / 2, 1200, 72, t, 8.9, 2.3,
        { weight: 800, track: -1, rgb: GOLD_LT, extrude: 4 });
    }
  }
  /* 11.5-15 CTA */
  if (t >= 11.4) {
    const e = env(t, 11.4, 0.3, 15.0, 0.0);
    if (e > 0.001) {
      x.save(); x.globalAlpha = e;
      x.fillStyle = 'rgba(1,3,2,0.94)';
      x.fillRect(0, 0, W, H);
      x.restore();
      const em = A('emblem');
      if (em.naturalWidth) {
        x.save(); x.globalAlpha = e;
        x.translate(W / 2, 560);
        const s = Math.min(1.4, em.naturalWidth > 0 ? 640 / em.naturalWidth : 1);
        x.scale(s, s);
        x.drawImage(em, -em.naturalWidth / 2, -em.naturalHeight / 2, em.naturalWidth, em.naturalHeight);
        x.restore();
      }
      if (FLAGS.pt) {
        x.save(); x.globalAlpha = e;
        x.drawImage(FLAGS.pt, W / 2 - 110, 880, 220, 143);
        x.restore();
      }
      kline('Tua palavra constrói', W / 2, 1180, 68, t, 11.8, 3.0,
        { weight: 800, track: -1, rgb: TEXT, glow: EMERALD, extrude: 4 });
      kline('o supEars.', W / 2, 1290, 68, t, 12.4, 2.4,
        { weight: 800, track: -1, rgb: TEXT, glow: EMERALD, extrude: 4 });
      kline('Estreia · 10 de outubro de 2026', W / 2, 1440, 34, t, 12.9, 1.9,
        { weight: 600, track: 1.2, rgb: GOLD_LT });
    }
  }

  grain(0.025);
  x.setTransform(1, 0, 0, 1, 0, 0);
}

window.__draw = draw;
window.__ready = loadFlags();
}
</script>
</body>
</html>
