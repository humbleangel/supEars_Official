<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  .off { position: absolute; left: -99999px; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div class="off">
  <img id="crest" src="assets30/crest.png">
  <img id="emblem" src="assets30/emblem.png">
  <img id="appicon" src="assets30/appicon.png">
</div>
<script src="bg3d.js"></script>
<script src="ktype.js"></script>
<script src="fx.js"></script>
<script src="collage_cues.js"></script>
<script>
{
'use strict';
const W = 1920, H = 1080, DUR = 30.0;
const c = document.getElementById('c');
const x = c.getContext('2d');
const A = id => document.getElementById(id);
const TAU = Math.PI * 2;

const EMERALD = [16, 185, 129], EMERALD_LT = [122, 240, 190];
const REC = [231, 76, 60];
const GOLD = [201, 162, 39], GOLD_LT = [231, 193, 90];
const TEXT = [234, 242, 238], MUTED = [143, 167, 155];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, t) => ease((t - e0) / (e1 - e0));
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const frac = v => v - Math.floor(v);
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
const env = (t, s0, fi, s1, fo) => smooth(s0, s0 + fi, t) * (1 - smooth(s1 - fo, s1, t));

const FLAGS = {};
function loadFlags() {
  const names = ['pt','en','es','fr','de','it','ru','zh','ja','ko','nl','pl','tr','uk','hi','ar','id','vi','ro','el','sv','cs','hu','ur','th'];
  return Promise.all(names.map(n => new Promise(res => {
    if (typeof FLAG_B64 === 'undefined' || !FLAG_B64[n]) return res();
    const im = new Image();
    im.onload = () => { FLAGS[n] = im; res(); };
    im.onerror = () => res();
    im.src = 'data:image/png;base64,' + FLAG_B64[n];
  })));
}

const LANGNAME = { pt:'Portuguese', en:'English', es:'Spanish', fr:'French', de:'German', it:'Italian', ru:'Russian', zh:'Chinese', ja:'Japanese', ko:'Korean', nl:'Dutch', pl:'Polish', tr:'Turkish', uk:'Ukrainian', hi:'Hindi', ar:'Arabic', id:'Indonesian', vi:'Vietnamese', ro:'Romanian', el:'Greek', sv:'Swedish', cs:'Czech', hu:'Hungarian', ur:'Urdu', th:'Thai' };
const codeOf = lang => (lang || 'en').split('-')[0];
const HITS = (window.COLLAGE && window.COLLAGE.hits) || [];
const CAPTIONS = {
  hook: 'Are you tired of paying subscriptions to talk?',
  brand_F: 'supEars. The Ear that writes what it hears.',
  privacy: '100% offline. No account. No cloud.',
  how_F: 'Tap the ear. Speak. Read what it writes.',
  cta2: 'supEars. Public release October tenth.'
};
const ANCHORS = (window.COLLAGE && window.COLLAGE.anchors) || [];
const ANDUR = { hook: 2.42, brand_F: 4.13, privacy: 4.87, how_F: 5.14, cta2: 2.4 };

/* one caption component everywhere: anchors win, else active language hit */
function activeCaption(t) {
  for (const a of ANCHORS) {
    const d = ANDUR[a.id] || 3;
    if (t >= a.start && t < a.start + d) return { text: CAPTIONS[a.id] || a.id, code: null };
  }
  for (const h of HITS) {
    if (t >= h.start && t < h.start + h.dur) return { text: LANGNAME[codeOf(h.lang)] || h.id, code: codeOf(h.lang) };
  }
  return null;
}
function caption(t, a) {
  const cap = activeCaption(t);
  if (!cap || a <= 0.001) return;
  x.save();
  x.globalAlpha = a;
  x.font = '600 34px "Segoe UI",system-ui,sans-serif';
  const tw = x.measureText(cap.text).width;
  const pw = tw + (cap.code ? 90 : 56);
  const px = W / 2 - pw / 2, py = H - 150;
  x.fillStyle = 'rgba(0,0,0,0.68)';
  x.beginPath();
  if (x.roundRect) x.roundRect(px, py, pw, 64, 32); else x.rect(px, py, pw, 64);
  x.fill();
  x.strokeStyle = rgba(EMERALD, 0.5); x.lineWidth = 2; x.stroke();
  let tx = W / 2 - tw / 2 + (cap.code ? 24 : 0);
  if (cap.code && FLAGS[cap.code]) x.drawImage(FLAGS[cap.code], px + 22, py + 14, 52, 34);
  x.fillStyle = rgba(TEXT, 1);
  x.textAlign = 'left'; x.textBaseline = 'middle';
  x.fillText(cap.text, tx, py + 34);
  x.restore();
}

/* 2001 grammar: perspective tunnel flying at the camera */
function gridTunnel(t, cx, horizon, a, speed) {
  if (a <= 0.001) return;
  x.save();
  x.globalAlpha = a;
  x.globalCompositeOperation = 'lighter';
  const vx = cx + Math.sin(t * 0.5) * 40;
  x.lineWidth = 2;
  for (let i = 0; i < 24; i++) {
    const ang = (i / 24) * TAU + t * 0.06;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const g = x.createLinearGradient(vx, horizon, vx + dx * 1400, horizon + dy * 1400);
    g.addColorStop(0, rgba(EMERALD, 0.0));
    g.addColorStop(0.35, rgba(i % 4 === 0 ? GOLD : EMERALD, 0.35));
    g.addColorStop(1, rgba(i % 4 === 0 ? GOLD_LT : EMERALD_LT, 0.0));
    x.strokeStyle = g;
    x.beginPath(); x.moveTo(vx, horizon); x.lineTo(vx + dx * 1400, horizon + dy * 1400); x.stroke();
  }
  for (let i = 0; i < 14; i++) {
    const z = frac(i / 14 + t * speed);
    const y = horizon + (H - horizon) * Math.pow(z, 2.4);
    x.strokeStyle = rgba(i % 3 === 0 ? GOLD : EMERALD, 0.08 + 0.5 * Math.pow(z, 1.5));
    x.lineWidth = 1 + 5 * z * z;
    x.beginPath();
    x.ellipse(vx, horizon, 60 + (W * 0.75) * Math.pow(z, 2.2), Math.max(1, (y - horizon) * 0.9), 0, 0, TAU);
    x.stroke();
  }
  x.restore();
}
/* warp starfield: streaks, not dots */
function warpStars(t, cx, cy, a, speed, n) {
  if (a <= 0.001) return;
  x.save();
  x.globalAlpha = a;
  x.globalCompositeOperation = 'lighter';
  x.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const s1 = frac(i * 0.6180339), s2 = frac(i * 0.381966 + 0.5);
    const ang = s1 * TAU;
    const r = frac(s2 + t * speed * (0.3 + s1));
    const R = Math.pow(r, 2.0) * 1100;
    const r0 = Math.pow(Math.max(0, r - 0.03), 2.0) * 1100;
    const X = cx + Math.cos(ang) * R, Y = cy + Math.sin(ang) * R * 0.62;
    const X0 = cx + Math.cos(ang) * r0, Y0 = cy + Math.sin(ang) * r0 * 0.62;
    const tint = i % 5 === 0 ? GOLD_LT : (i % 3 === 0 ? EMERALD_LT : TEXT);
    x.strokeStyle = rgba(tint, 0.15 + 0.6 * r);
    x.lineWidth = 1 + 3 * r;
    x.beginPath(); x.moveTo(X0, Y0); x.lineTo(X, Y); x.stroke();
  }
  x.restore();
}
/* slit-scan entry burst: radial streak flash */
function stargateBurst(t, t0, cx, cy, a) {
  const e = env(t, t0, 0.12, t0 + 1.1, 0.9);
  if (e <= 0.001) return;
  x.save();
  x.globalAlpha = a * e;
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 90; i++) {
    const ang = (i / 90) * TAU + 0.3;
    const L = 120 + 700 * easeOut(win(t, t0, t0 + 0.9)) * frac(i * 0.754 + 0.2);
    const tint = i % 4 === 0 ? GOLD_LT : EMERALD_LT;
    x.strokeStyle = rgba(tint, 0.5 * (1 - win(t, t0, t0 + 1.0)));
    x.lineWidth = 2 + 3 * frac(i * 0.33);
    x.beginPath();
    x.moveTo(cx + Math.cos(ang) * 60, cy + Math.sin(ang) * 40);
    x.lineTo(cx + Math.cos(ang) * (60 + L), cy + Math.sin(ang) * (40 + L * 0.62));
    x.stroke();
  }
  x.restore();
}
/* additive ear: dark contrast disc + lighter halo + bright icon + bloom ring */
function earHero(t, cx, cy, R, a) {
  if (a <= 0.001) return;
  const im = A('appicon');
  const pulse = 1 + 0.02 * Math.sin(t * 2.4);
  x.save();
  x.globalAlpha = a;
  x.fillStyle = 'rgba(0,0,0,0.72)';
  x.beginPath(); x.arc(cx, cy, R * 1.55 * pulse, 0, TAU); x.fill();
  const halo = x.createRadialGradient(cx, cy, R * 0.4, cx, cy, R * 1.9);
  halo.addColorStop(0, rgba(EMERALD, 0.30));
  halo.addColorStop(0.6, rgba(EMERALD, 0.10));
  halo.addColorStop(1, rgba(EMERALD, 0.0));
  x.save();
  x.globalCompositeOperation = 'lighter';
  x.fillStyle = halo;
  x.beginPath(); x.arc(cx, cy, R * 1.9, 0, TAU); x.fill();
  x.restore();
  if (im.naturalWidth) {
    x.save();
    x.filter = 'brightness(1.6)';
    x.translate(cx, cy); x.scale(pulse, pulse);
    x.drawImage(im, -R, -R, R * 2, R * 2);
    x.restore();
  }
  x.beginPath(); x.arc(cx, cy, R * 1.22, 0, TAU);
  x.strokeStyle = rgba(REC, 0.95); x.lineWidth = 6;
  x.shadowColor = rgba(REC, 0.8); x.shadowBlur = 30;
  x.stroke();
  x.restore();
  const codes = ['es', 'ja', 'de'];
  x.save();
  x.globalAlpha = a;
  codes.forEach((cd, k) => {
    const f = FLAGS[cd];
    if (!f) return;
    const ang = t * 0.6 + k * TAU / 3;
    x.drawImage(f, cx + Math.cos(ang) * R * 1.75 - 28, cy + Math.sin(ang) * R * 1.75 - 18, 56, 36);
  });
  x.restore();
}
/* time-based language scroll (texture) */
const LANGS = [
  ['Portuguese','pt'], ['English','en'], ['Spanish','es'], ['French','fr'], ['German','de'],
  ['Italian','it'], ['Russian','ru'], ['Chinese','zh'], ['Japanese','ja'], ['Korean','ko'],
  ['Dutch','nl'], ['Polish','pl'], ['Turkish','tr'], ['Ukrainian','uk'], ['Hindi','hi'],
  ['Arabic','ar'], ['Indonesian','id'], ['Vietnamese','vi'], ['Romanian','ro'], ['Greek','el'],
  ['Swedish','sv'], ['Czech','cs'], ['Hungarian','hu'], ['Urdu','ur'], ['Thai','th']
];
function langScroll(t, cx, cy, a, t0, speed, size) {
  if (a <= 0.001) return;
  x.save();
  x.globalAlpha = a;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const n = LANGS.length;
  for (let k = -2; k < 5; k++) {
    const idx = Math.floor((t - t0) * speed) + k;
    const li = ((idx % n) + n) % n;
    const fr2 = (t - t0) * speed - Math.floor((t - t0) * speed);
    const yy = cy + (k - fr2) * size * 1.35;
    const dist = Math.abs(k - fr2 - 1);
    const aa = clamp(1 - dist / 2.6, 0, 1);
    if (aa <= 0.01) continue;
    const f = FLAGS[LANGS[li][1]];
    x.save();
    x.globalAlpha = aa;
    x.font = `800 ${size}px "Segoe UI",system-ui,sans-serif`;
    if (dist < 0.6) { x.shadowColor = rgba(EMERALD, 0.7); x.shadowBlur = size * 0.4; }
    x.fillStyle = rgba(dist < 0.6 ? TEXT : MUTED, 1);
    const label = LANGS[li][0];
    const tw = x.measureText(label).width;
    x.fillText(label, cx, yy);
    if (f && dist < 1.2) x.drawImage(f, cx - tw / 2 - 74, yy - 17, 56, 36);
    x.restore();
  }
  x.restore();
}
/* kinetic line with motion ghosts during its reveal (trail = f(t), no state) */
function kline(txt, cx, cy, size, t, t0, dur, opts = {}) {
  const hot = win(t, t0, t0 + 0.45);
  if (t >= t0 && hot < 1) {
    x.save(); x.globalAlpha = 0.22 * (1 - hot);
    ktype(x, txt, cx - 26 * (1 - hot), cy, size, t, t0, dur, opts);
    x.restore();
    x.save(); x.globalAlpha = 0.12 * (1 - hot);
    ktype(x, txt, cx - 52 * (1 - hot), cy, size, t, t0, dur, opts);
    x.restore();
  }
  ktype(x, txt, cx, cy, size, t, t0, dur, opts);
}
function grain(a) {
  x.save();
  x.globalAlpha = a;
  let s = 7;
  const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 0; i < 500; i++) x.fillStyle = r() > 0.5 ? '#fff' : '#000', x.fillRect((r() * W) | 0, (r() * H) | 0, 2, 2);
  x.restore();
}
function vignette(a) {
  const g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${a})`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
}

function draw(t) {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = '#000';
  x.fillRect(0, 0, W, H);
  x.setTransform(0.5, 0, 0, 0.5, 0, 0);
  const g0 = x.createLinearGradient(0, 0, 0, H);
  g0.addColorStop(0, '#030806'); g0.addColorStop(0.55, '#05110D'); g0.addColorStop(1, '#020504');
  x.fillStyle = g0; x.fillRect(0, 0, W, H);

  /* BEAT 1 — 0-3 HOOK */
  if (t < 3.2) {
    const a = env(t, 0, 0.12, 3.2, 0.25);
    if (a > 0.001) {
      if (t < 1.0) FX.whip(x, W, H, t, 0.0, 0.5, 0, '231,76,60');
      stargateBurst(t, 0.0, W / 2, H / 2 - 60, a * 0.8);
      warpStars(t, W / 2, H / 2, a * 0.5, 0.25, 70);
      const vg = x.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 900);
      vg.addColorStop(0, `rgba(231,76,60,${0.16 * a})`);
      vg.addColorStop(1, 'rgba(231,76,60,0)');
      x.fillStyle = vg; x.fillRect(0, 0, W, H);
      kline('Are you tired of paying', W / 2, H / 2 - 170, 88, t, 0.05, 3.0,
        { weight: 800, track: -2, rgb: TEXT, glow: REC, extrude: 4 });
      kline('subscriptions to talk?', W / 2, H / 2 - 45, 88, t, 0.55, 2.5,
        { weight: 800, track: -2, rgb: TEXT, glow: REC, extrude: 4 });
    }
  }
  /* BEAT 2 — 3-6 BATTLE CRY (gold slam + shake) */
  if (t >= 3.0 && t < 6.2) {
    const a = env(t, 3.0, 0.1, 6.2, 0.2);
    if (a > 0.001) {
      const slam = easeBack(win(t, 3.05, 3.6));
      const shake = (t < 4.2 ? Math.sin((t - 3.05) * 40) * 14 * Math.exp(-3 * (t - 3.05)) : 0);
      x.save();
      x.globalAlpha = a;
      x.translate(W / 2 + shake, H / 2);
      x.scale(1.25 - 0.25 * slam, 1.25 - 0.25 * slam);
      x.translate(-W / 2, -H / 2);
      const gg = x.createLinearGradient(0, 0, W, H);
      gg.addColorStop(0, '#F0CE6B'); gg.addColorStop(0.5, '#C9A227'); gg.addColorStop(1, '#7A5F1C');
      x.fillStyle = gg; x.fillRect(0, 0, W, H);
      x.restore();
      kline('Escape the Subscriptions Trap.', W / 2 + shake, H / 2 - 20, 78, t, 3.15, 2.9,
        { weight: 800, track: -2, rgb: [10, 13, 11] });
      kline('supEars. The Ear that writes.', W / 2 + shake, H / 2 + 110, 44, t, 3.9, 2.1,
        { weight: 700, track: 0, rgb: [20, 24, 21] });
    }
  }
  /* BEAT 3 — 6-12 TUNNEL (2001: grid flies, ear dives, flags streak, captions speak) */
  if (t >= 6.0 && t < 12.2) {
    const a = env(t, 6.0, 0.2, 12.2, 0.3);
    if (a > 0.001) {
      if (t < 7.0) FX.whip(x, W, H, t, 6.0, 0.5, 1, '16,185,129');
      stargateBurst(t, 6.0, W / 2, H / 2 - 60, a);
      gridTunnel(t - 6.0, W / 2, H * 0.40, a, 0.55);
      warpStars(t, W / 2, H / 2 - 60, a * 0.9, 0.5, 120);
      const dive = easeOut(win(t, 6.2, 11.5));
      earHero(t, W / 2, lerp(H / 2 - 260, H / 2 - 60, dive), lerp(90, 200, dive), a);
      const nHit = HITS.filter(h => t >= h.start && t < h.start + h.dur).length;
      x.save();
      x.globalAlpha = a;
      x.font = '700 34px "Segoe UI",system-ui,sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillStyle = rgba(GOLD_LT, 0.95);
      x.fillText(`VOICES OF THE WORLD · ${HITS.indexOf(HITS.find(h => t >= h.start && t < h.start + h.dur)) + 1 || '—'}/25`, W / 2, 150);
      x.restore();
      caption(t, a);
    }
  }
  /* BEAT 4 — 12-18 EAR HERO + scroll */
  if (t >= 12.0 && t < 18.4) {
    const a = env(t, 12.0, 0.25, 18.4, 0.3);
    if (a > 0.001) {
      x.save(); x.globalAlpha = a;
      drawBackdrop(x, W, H, t, 0.6, 0.4, 0.4, 0.5);
      x.restore();
      earHero(t, 480, H / 2 - 60, 230, a);
      langScroll(t, 1330, H / 2 - 60, a, 12.0, 4.2, 54);
      kline('One tap. Twenty-five tongues.', W / 2, 170, 52, t, 12.3, 5.5,
        { weight: 800, track: -1, rgb: TEXT, glow: GOLD_LT, extrude: 4 });
      caption(t, a);
    }
  }
  /* BEAT 5 — 18-23 PRIVACY (tunnel freezes, clean dark) */
  if (t >= 18.2 && t < 23.4) {
    const a = env(t, 18.2, 0.3, 23.4, 0.3);
    if (a > 0.001) {
      gridTunnel(1.2, W / 2, H * 0.40, a * 0.25 * (1 - win(t, 18.2, 19.5)), 0.0);
      if (t < 18.75) FX.whip(x, W, H, t, 18.2, 0.5, 0, '16,185,129');
      kline('100% offline.', W / 2, H / 2 - 120, 120, t, 18.35, 4.8,
        { weight: 800, track: -2, rgb: TEXT, glow: EMERALD, extrude: 5 });
      kline('No account. No cloud.', W / 2, H / 2 + 60, 52, t, 19.3, 3.9,
        { weight: 600, track: 0.6, rgb: MUTED });
      const codes = ['pt', 'es', 'de', 'ja', 'fr', 'it'];
      codes.forEach((cd, k) => {
        const f = FLAGS[cd];
        if (!f) return;
        const bx = W / 2 + (k - 2.5) * 150;
        const by = H / 2 + 230;
        const pop = easeBack(win(t, 19.6 + k * 0.18, 20.1 + k * 0.18));
        x.save(); x.globalAlpha = a * clamp(pop, 0, 1);
        x.translate(bx, by); x.scale(pop, pop);
        x.fillStyle = 'rgba(0,0,0,0.6)';
        x.fillRect(-62, -30, 124, 78);
        x.strokeStyle = rgba(EMERALD, 0.6); x.lineWidth = 2; x.strokeRect(-62, -30, 124, 78);
        x.drawImage(f, -46, -21, 92, 60);
        x.restore();
      });
      caption(t, a);
    }
  }
  /* BEAT 6 — 23-27 HOW 1-2-3 staggered slam */
  if (t >= 23.2 && t < 27.2) {
    const a = env(t, 23.2, 0.2, 27.2, 0.25);
    if (a > 0.001) {
      const cards = [
        ['1', 'TAP THE EAR', EMERALD],
        ['2', 'SPEAK', GOLD],
        ['3', 'READ WHAT IT WRITES', EMERALD]
      ];
      cards.forEach((cd, k) => {
        const t0 = 23.35 + k * 0.55;
        const pop = easeBack(win(t, t0, t0 + 0.5));
        if (pop <= 0) return;
        const cy = H / 2 - 180 + k * 180;
        x.save();
        x.globalAlpha = a * clamp(pop, 0, 1);
        x.translate(W / 2, cy); x.scale(pop, pop);
        x.fillStyle = 'rgba(2,8,6,0.92)';
        x.fillRect(-520, -70, 1040, 140);
        x.strokeStyle = rgba(cd[2], 0.8); x.lineWidth = 3; x.strokeRect(-520, -70, 1040, 140);
        x.font = '800 64px "Segoe UI",system-ui,sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillStyle = rgba(cd[2], 1);
        x.fillText(cd[0], -430, 4);
        x.font = '800 58px "Segoe UI",system-ui,sans-serif';
        x.fillStyle = rgba(TEXT, 1);
        x.fillText(cd[1], 60, 4);
        x.restore();
      });
      caption(t, a);
    }
  }
  /* BEAT 7 — 27-30 END CARD */
  if (t >= 27.0) {
    const e = env(t, 27.0, 0.35, 30.0, 0.0);
    if (e > 0.001) {
      x.save(); x.globalAlpha = e;
      x.fillStyle = 'rgba(1,3,2,0.94)';
      x.fillRect(0, 0, W, H);
      x.restore();
      const em = A('emblem');
      if (em.naturalWidth) {
        const s = lerp(1.2, 1.0, easeOut(win(t, 27.1, 27.9)));
        x.save(); x.globalAlpha = e;
        x.translate(W / 2, H / 2 - 130); x.scale(s, s);
        x.drawImage(em, -em.naturalWidth / 2, -em.naturalHeight / 2, em.naturalWidth, em.naturalHeight);
        x.restore();
      }
      kline('supEars', W / 2, H / 2 + 230, 96, t, 27.3, 2.6,
        { weight: 800, track: 2, rgb: TEXT, glow: EMERALD, extrude: 5 });
      kline('Public release · October 10, 2026', W / 2, H / 2 + 318, 32, t, 27.6, 2.3,
        { weight: 600, track: 1.4, rgb: GOLD_LT });
      kline('Developed by HumbleAngel', W / 2, H / 2 + 366, 24, t, 27.9, 2.0,
